plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "terraformers"
        url = 'https://maven.terraformersmc.com/releases/'
    }

    maven {
        name = 'modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"

    implementation "net.java.dev.jna:jna:5.14.0"
    implementation "net.java.dev.jna:jna-platform:5.14.0"

    implementation "io.github.spair:imgui-java-binding:${project.imguiVersion}"
    include "io.github.spair:imgui-java-binding:${project.imguiVersion}"

    implementation "io.github.spair:imgui-java-lwjgl3:${project.imguiVersion}"
    include "io.github.spair:imgui-java-lwjgl3:${project.imguiVersion}"

    implementation "io.github.spair:imgui-java-natives-windows:${project.imguiVersion}"
    include "io.github.spair:imgui-java-natives-windows:${project.imguiVersion}"

    modCompileOnly files('libs/inventoryhud.fabric.1.21.11-3.4.29.jar')
    modCompileOnly files('libs/xaerominimap-fabric-1.21.11-25.3.5.jar')

    include(modImplementation("maven.modrinth:crossfabric:0.1.2"))

    include(implementation project(':api'))
}

loom {
    accessWidenerPath = file('src/main/resources/streamproof.aw')
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }

    from('libs') {
        include 'MinHook.x64.dll'
        include 'MinHook.x86.dll'
        into 'libs'
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}

tasks.named('remapJar') {
    doLast {
        if (!project.hasProperty("deployToMinecraft")) {
            return
        }

        def modsDir = project.property("minecraftModsDir")
        def naming = "${project.archives_base_name}-${project.version}.jar"
        def sourceFile = file("${buildDir}/libs/${naming}")
        def destinationDir = file(modsDir)

        if (sourceFile.exists()) {
            copy {
                from sourceFile
                into destinationDir
            }

            def execOps = project.services.get(ExecOperations)
            execOps.exec {
                commandLine 'powershell', '-Command', '[Console]::Beep(2500, 200)'
                ignoreExitValue = true
            }

            println "deployed ${naming}"
        }
    }
}