plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "terraformers"
        url = 'https://maven.terraformersmc.com/releases/'
    }

    maven {
        name = 'modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'bawnorton'
        url = "https://maven.bawnorton.com/releases"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${project.mod_menu_version}"

    implementation "net.java.dev.jna:jna:5.14.0"
    implementation "net.java.dev.jna:jna-platform:5.14.0"

    implementation "io.github.spair:imgui-java-binding:${project.imguiVersion}"
    include "io.github.spair:imgui-java-binding:${project.imguiVersion}"

    implementation "io.github.spair:imgui-java-lwjgl3:${project.imguiVersion}"
    include "io.github.spair:imgui-java-lwjgl3:${project.imguiVersion}"

    implementation "io.github.spair:imgui-java-natives-windows:${project.imguiVersion}"
    include "io.github.spair:imgui-java-natives-windows:${project.imguiVersion}"

    compileOnly files('libs/inventoryhud.fabric.26.1.2-3.4.31.jar')
    compileOnly files('libs/xaerominimap-fabric-26.1.2-26.6.0.jar')
    compileOnly files('libs/ukus-armor-hud-fabric-0.11.0+mc26.1.jar')
    compileOnly files('libs/appleskin-fabric-mc26.1.2-3.0.10.jar')
    compileOnly files('libs/ImmediatelyFast-Fabric-1.15.3+26.1.jar')

    include(implementation("maven.modrinth:crossfabric:0.1.2"))
    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7")))

    include(implementation project(':api'))
}

loom {
    accessWidenerPath = file('src/main/resources/streamproof.aw')
    runConfigs.configureEach {
        property "fabric.remapClasspathFile", "${project.buildDir}/loom-cache/remapClasspath.txt"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }

    from('libs') {
        include 'MinHook.x64.dll'
        include 'MinHook.x86.dll'
        into 'libs'
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}

// helps my flowstate when developing :3
def autopush = providers.environmentVariable("xNasuniStreamproofFlowStateAutopushScript")
tasks.register('xNasuniStreamproofFlowStateAutopush', Exec) {
    dependsOn tasks.named('jar')
    onlyIf { autopush.isPresent() && !autopush.get().isBlank() }

    workingDir = layout.projectDirectory.asFile

    doFirst {
        def builtJar = tasks.named('jar').get().archiveFile.get().asFile
        commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', autopush.get(), builtJar.absolutePath
    }
}

tasks.named('build') {
    finalizedBy 'xNasuniStreamproofFlowStateAutopush'
}